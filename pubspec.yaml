# ==============================================================================
# PROJECT METADATA
# ==============================================================================

name: flutter_md

description: >
  Fast Markdown parser and canvas renderer for Flutter with cross-widget text
  selection, streaming parsing and syntax highlighting.

version: 0.7.1

homepage: https://github.com/itsezlife/md
repository: https://github.com/itsezlife/md
issue_tracker: https://github.com/itsezlife/md/issues

topics:
  - markdown
  - rendering
  - selectable
  - chatgpt
  - gemini

platforms:
  linux:
  macos:
  windows:
  android:
  ios:
  web:

# ==============================================================================
# DEPENDENCIES
# ==============================================================================

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  characters: ^1.3.0
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  markdown: ^7.3.0
  benchmark_harness: ^2.3.1
